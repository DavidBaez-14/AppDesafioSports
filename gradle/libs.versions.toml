# Catálogo de versiones de Desafío Sports.
#
# Base: AGP 9.1.0, Gradle 9.3.1 y Kotlin 2.2.10.
# Reglas para actualizar (detalle en docs/arquitectura.md, "Versiones"):
#  - Kotlin 2.2 solo lee librerías compiladas con Kotlin <= 2.3. Antes de subir una
#    librería, revisa qué kotlin-stdlib declara.
#  - compileSdk es 36. Ya exigen compileSdk 37: BOM de Compose 2026.09+, core 1.19+,
#    navigation-compose 2.10+ y lifecycle 2.11+ (sus variantes de Compose).
#  - Una actualización de versiones es su propia spec, no un cambio de paso.

[versions]
agp = "9.1.0"
kotlin = "2.2.10"
coreKtx = "1.18.0"
activityCompose = "1.13.0"
composeBom = "2026.06.01"
lifecycle = "2.10.0"
navigationCompose = "2.9.8"
kotlinxSerialization = "1.9.0"
coroutines = "1.10.2"
supabase = "3.2.6"
ktor = "3.3.3"
retrofit = "3.0.0"
okhttp = "5.3.2"
junit = "4.13.2"
# Login nativo con Google (MOV-0006)
credentials = "1.5.0"
googleid = "1.1.1"

[libraries]
# AndroidX
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }

# Compose (versiones dadas por la BOM)
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }

# Kotlin
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }

# Sesión: Supabase Auth (solo el módulo de Auth; los datos van por BackendCodeCup)
supabase-bom = { group = "io.github.jan-tennert.supabase", name = "bom", version.ref = "supabase" }
supabase-auth = { group = "io.github.jan-tennert.supabase", name = "auth-kt" }
ktor-client-okhttp = { group = "io.ktor", name = "ktor-client-okhttp", version.ref = "ktor" }

# Login nativo con Google: Credential Manager entrega el ID token y Supabase lo cambia por sesión (MOV-0006)
androidx-credentials = { group = "androidx.credentials", name = "credentials", version.ref = "credentials" }
androidx-credentials-play-services = { group = "androidx.credentials", name = "credentials-play-services-auth", version.ref = "credentials" }
googleid = { group = "com.google.android.libraries.identity.googleid", name = "googleid", version.ref = "googleid" }

# Red hacia BackendCodeCup
retrofit = { group = "com.squareup.retrofit2", name = "retrofit", version.ref = "retrofit" }
retrofit-kotlinx-serialization = { group = "com.squareup.retrofit2", name = "converter-kotlinx-serialization", version.ref = "retrofit" }
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
okhttp-logging = { group = "com.squareup.okhttp3", name = "logging-interceptor", version.ref = "okhttp" }

# Tests
junit = { group = "junit", name = "junit", version.ref = "junit" }
okhttp-mockwebserver = { group = "com.squareup.okhttp3", name = "mockwebserver", version.ref = "okhttp" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
